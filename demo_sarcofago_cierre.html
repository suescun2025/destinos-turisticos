<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demostración: Sarcófago Interactivo (Cierre y Apertura)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #0a192f 0%, #020b14 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            padding: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            text-align: center;
        }

        p.instructions {
            font-size: 1rem;
            color: #00f0ff;
            margin-bottom: 30px;
            background: rgba(0, 240, 255, 0.1);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            text-align: center;
        }

        .showcase-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: center;
            max-width: 900px;
        }

        .card {
            background: rgba(13, 27, 42, 0.7);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 1.15rem;
            color: #e0e1dd;
            margin-bottom: 16px;
        }

        /* Contenedor del Sarcófago interactivo con click */
        .interactive-sarcophagus-stage {
            position: relative;
            width: 260px;
            height: 380px;
            cursor: pointer;
            perspective: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Caja trasera fija */
        .sarcophagus-case {
            position: absolute;
            width: 120px;
            height: auto;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.64, 1), filter 0.3s;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
            pointer-events: none;
        }

        /* Tapa delantera móvil */
        .sarcophagus-lid {
            position: absolute;
            width: 124px;
            height: auto;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            transition: all 0.7s cubic-bezier(0.34, 1.25, 0.64, 1);
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
            z-index: 5;
            pointer-events: none;
        }

        /* Estado Cerrado al hacer clic */
        .interactive-sarcophagus-stage.closed .sarcophagus-lid {
            left: 68px; /* Se monta exactamente sobre la caja */
            transform: translateY(-50%) scale(1.03) translateZ(10px);
            filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.6));
        }

        .interactive-sarcophagus-stage.closed .sarcophagus-case {
            right: 68px; /* Se centra perfectamente */
            filter: brightness(0.9);
        }

        /* Animación GIF continua */
        .gif-preview {
            width: 240px;
            height: 340px;
            object-fit: contain;
        }

        .btn-toggle {
            margin-top: 18px;
            padding: 10px 22px;
            background: linear-gradient(135deg, #ffd700, #ff9900);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .status-badge {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .status-badge span {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Muestra Interactiva: Sarcófago de Tutankamón</h1>
    <p class="instructions">👉 Haz clic sobre el sarcófago interactivo para abrirlo y cerrarlo</p>

    <div class="showcase-container">
        <!-- Tarjeta Interactiva con Clic -->
        <div class="card">
            <h2>Demostración con Clic (Interactivo)</h2>
            <div class="interactive-sarcophagus-stage" id="sarcophagusStage" title="Haz clic para alternar Abierto / Cerrado">
                <!-- Parte Trasera / Caja -->
                <img src="sarcofago_caja.png" alt="Caja interior del sarcófago" class="sarcophagus-case" id="sarcophagusCase">
                <!-- Parte Delantera / Tapa -->
                <img src="sarcofago_tapa.png" alt="Tapa delantera del sarcófago" class="sarcophagus-lid" id="sarcophagusLid">
            </div>
            <button class="btn-toggle" id="btnToggle">Cerrar Sarcófago</button>
            <div class="status-badge">Estado actual: <span id="statusText">Abierto</span></div>
        </div>

        <!-- Tarjeta Animada en Bucle -->
        <div class="card">
            <h2>Animación Continua (GIF)</h2>
            <img src="tutankamon_cerrandose.gif" alt="Animación del sarcófago cerrándose" class="gif-preview">
            <div class="status-badge">Ciclo automático de cierre y apertura</div>
        </div>
    </div>

    <script>
        const stage = document.getElementById('sarcophagusStage');
        const btn = document.getElementById('btnToggle');
        const statusText = document.getElementById('statusText');

        function toggleSarcophagus() {
            stage.classList.toggle('closed');
            const isClosed = stage.classList.contains('closed');
            statusText.textContent = isClosed ? 'Cerrado' : 'Abierto';
            btn.textContent = isClosed ? 'Abrir Sarcófago' : 'Cerrar Sarcófago';
            btn.style.background = isClosed 
                ? 'linear-gradient(135deg, #00f0ff, #0088ff)' 
                : 'linear-gradient(135deg, #ffd700, #ff9900)';
        }

        stage.addEventListener('click', toggleSarcophagus);
        btn.addEventListener('click', toggleSarcophagus);
    </script>
</body>
</html>
